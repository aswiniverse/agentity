<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agentity Admin — Agents</title>
  <link rel="stylesheet" href="/admin/static/style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-logo">Agent<span>ity</span></div>
    <nav>
      <a href="/admin/"><span class="icon">&#9632;</span> Dashboard</a>
      <a href="/admin/agents.html" class="active"><span class="icon">&#9675;</span> Agents</a>
      <a href="/admin/tokens.html"><span class="icon">&#128273;</span> Token Inspector</a>
      <a href="/admin/policies.html"><span class="icon">&#128220;</span> Policies</a>
      <a href="/admin/audit.html"><span class="icon">&#128196;</span> Audit Log</a>
    </nav>
  </aside>

  <div class="main">
    <header class="header">
      <h1>Agents</h1>
      <div class="api-key-group">
        <label for="api-key-input">Admin API Key</label>
        <input type="password" id="api-key-input" placeholder="Enter admin API key…">
        <button class="btn btn-secondary" id="api-key-save">Save</button>
      </div>
    </header>

    <div class="content">
      <div class="table-wrapper">
        <div class="table-toolbar">
          <span class="table-toolbar-title">All Agents</span>
          <button class="btn btn-secondary" id="refresh-btn">&#8635; Refresh</button>
        </div>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Model</th>
              <th>Status</th>
              <th>Created At</th>
            </tr>
          </thead>
          <tbody id="agents-body">
            <tr class="empty-row"><td colspan="5">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Agent detail modal -->
  <div class="modal-overlay hidden" id="detail-overlay">
    <div class="modal">
      <div class="modal-title">Agent Detail</div>
      <div id="detail-body"></div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="detail-close">Close</button>
      </div>
    </div>
  </div>

  <script src="/admin/static/app.js"></script>
  <script src="/admin/static/agents.js"></script>
</body>
</html>
