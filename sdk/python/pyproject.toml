[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentity"
version = "0.1.0"
description = "Python SDK for Agentity — the open-source AI Agent IAM system"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["ai", "agents", "iam", "identity", "delegation", "langchain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "httpx>=0.27",
    "cryptography>=42",
]

[project.optional-dependencies]
async = ["anyio>=4"]
langchain = ["langchain-core>=0.2"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.urls]
Homepage = "https://github.com/agentity/agentity"
Documentation = "https://agentity.dev/docs/sdk/python"
Repository = "https://github.com/agentity/agentity"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentity*"]
